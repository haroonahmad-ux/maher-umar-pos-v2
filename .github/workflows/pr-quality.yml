name: Python Syntax and Style Review

on:
  pull_request:
    branches: [main, feature/bizcore-retailer-ui-csv-backup]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.14.10"
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Check style and common errors
        run: ruff check --select E4,E7,E9,F --ignore E701,E702,F401 --output-format=github main.py
