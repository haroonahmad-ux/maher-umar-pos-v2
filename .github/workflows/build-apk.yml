name: Build POS v2 APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos-v2-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses-dev \
            libtinfo6 \
            libltdl-dev \
            gettext \
            ccache

      - name: Install current Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "git+https://github.com/kivy/buildozer.git"

      - name: Verify build configuration
        run: |
          python --version
          java -version
          buildozer --version
          test -f buildozer.spec
          test -f main.py

      - name: Prepare isolated application source
        run: |
          rm -rf .app-source
          mkdir -p .app-source
          cp main.py .app-source/main.py
          base64 -d app_icon.png.b64 > app_icon.png
          cp app_icon.png .app-source/app_icon.png

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-v2-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 14
