name: Build and diagnose Maher Umar POS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "Maher_Umar_POS_UI_Fixed_v2-1.py"
      - "buildozer.spec"
      - "requirements.txt"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip \
            autoconf automake libtool libtool-bin libltdl-dev m4 gettext autopoint \
            pkg-config cmake zlib1g-dev libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev libtinfo6
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"
      - name: Verify Python syntax and expected app entrypoint
        run: |
          python -m py_compile main.py Maher_Umar_POS_UI_Fixed_v2-1.py
          grep -q "class MaherUmarPOSApp" main.py
      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee android-build.log
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maher-umar-pos-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maher-umar-pos-build-diagnostics
          path: |
            android-build.log
            .buildozer/android/platform/build-*/dists/**/build.log
          if-no-files-found: warn
          retention-days: 14
