name: PR Triage and Commit Categorization

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issues:
    types: [opened, reopened, edited]
  push:
    branches:
      - main
      - feature/bizcore-retailer-ui-csv-backup
      - feature/renjana-virtual-runtime

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ensure-labels:
    if: github.event_name == 'pull_request' || github.event_name == 'issues'
    runs-on: ubuntu-24.04
    steps:
      - name: Create automation labels if missing
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              ["area: android", "1d76db", "Android application and UI"],
              ["area: python", "3572A5", "Python application code"],
              ["area: database", "0e8a16", "Database and Supabase"],
              ["area: ci-cd", "5319e7", "CI/CD and automation"],
              ["area: docs", "0075ca", "Documentation"],
              ["area: dependencies", "fbca04", "Dependencies and build tooling"],
              ["area: tests", "bfd4f2", "Tests and quality checks"],
              ["kind: feature", "a2eeef", "Feature or enhancement"],
              ["kind: bug", "d73a4a", "Bug or defect"],
              ["kind: docs", "0075ca", "Documentation change or request"],
              ["kind: question", "d876e3", "Question or clarification"],
              ["kind: security", "b60205", "Security-related report"]
            ];
            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name, color, description
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

  label-pull-request:
    if: github.event_name == 'pull_request'
    needs: ensure-labels
    runs-on: ubuntu-24.04
    steps:
      - name: Apply labels from changed files and branch name
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  label-incoming-issue:
    if: github.event_name == 'issues'
    needs: ensure-labels
    runs-on: ubuntu-24.04
    steps:
      - name: Categorize issue from title and description
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ""}`.toLowerCase();
            const labels = [];
            if (/security|vulnerability|exposure|token leak/.test(text)) labels.push("kind: security");
            else if (/bug|crash|error|broken|not working|fails?/.test(text)) labels.push("kind: bug");
            else if (/feature|enhancement|please add|support for/.test(text)) labels.push("kind: feature");
            else if (/documentation|readme|how to/.test(text)) labels.push("kind: docs");
            else labels.push("kind: question");
            if (/supabase|database|sql|migration/.test(text)) labels.push("area: database");
            if (/android|apk|kotlin|jetpack/.test(text)) labels.push("area: android");
            if (/python|csv|buildozer/.test(text)) labels.push("area: python");
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, labels
            });

  categorize-commit:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Categorize pushed commits
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            RANGE="$AFTER_SHA"
          else
            RANGE="$BEFORE_SHA..$AFTER_SHA"
          fi
          echo "## Commit categorization" >> "$GITHUB_STEP_SUMMARY"
          git log --format='%h%x09%s' "$RANGE" | while IFS=$'\t' read -r sha subject; do
            case "$subject" in
              feat*:* ) category="feature" ;;
              fix*:* ) category="bug fix" ;;
              docs*:* ) category="documentation" ;;
              test*:* ) category="tests" ;;
              refactor*:* ) category="refactor" ;;
              chore*:*|ci*:* ) category="maintenance / CI" ;;
              *) category="other" ;;
            esac
            printf -- '- `%s` — **%s** — %s\n' "$sha" "$category" "$subject" >> "$GITHUB_STEP_SUMMARY"
          done

  request-reviewers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Request configured reviewers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWERS: ${{ vars.PR_REVIEWERS }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${REVIEWERS//[[:space:]]/}" ]]; then
            echo "PR_REVIEWERS repository variable is not configured; reviewer assignment skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          payload="$(REVIEWERS="$REVIEWERS" python -c 'import json,os; print(json.dumps({"reviewers":[x.strip() for x in os.environ["REVIEWERS"].split(",") if x.strip()]}))')"
          printf '%s' "$payload" | gh api --method POST "repos/$REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" --input -
